[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bipartite-pareto-layout"
version = "0.1.0"
description = "Multi-objective (NSGA-II) bipartite graph layout optimization over standard readability metrics"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "networkx",
    "pymoo",
    "scikit-learn",
    "scipy",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
